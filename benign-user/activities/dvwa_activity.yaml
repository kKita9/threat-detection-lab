- name: Access homepage
  command: curl -s -o /dev/null -w "%{http_code}" http://dvwa
  target: dvwa
  user: benign
  requires_session: false

- name: Set DVWA security to low
  command: 'curl -s -X POST -d "security=low&seclev_submit=Submit" http://dvwa/security.php -b /tmp/cookies.txt -c /tmp/cookies.txt -o /dev/null -w "%{http_code}"'
  target: dvwa
  user: admin
  requires_session: false

- name: Login with admin
  command: curl -s -X POST -d "username=admin&password=password&Login=Login" http://dvwa/login.php
    -c /tmp/cookies.txt -b /tmp/cookies.txt -L -o /dev/null -w "%{http_code}"
  target: dvwa
  user: admin
  requires_session: false

- name: Access security page
  command: curl -s http://dvwa/security.php -b /tmp/cookies.txt -c /tmp/cookies.txt
    -o /dev/null -w "%{http_code}"
