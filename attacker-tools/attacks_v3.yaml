ftp:
  - name: "FTP brute-force - multiple passwords for single user"
    destination: "ftp"
    category: "FTP-Patator"
    intensity: "medium"
    command: "hydra -t 4 -l testuser -P /wordlists/passwords.txt 172.18.0.4 -s 21 ftp"

  - name: "FTP brute-force - multiple usernames and passwords"
    destination: "ftp"
    category: "FTP-Patator"
    intensity: "high"
    command: "hydra -t 4 -L /wordlists/usernames.txt -P /wordlists/passwords.txt -s 21 172.18.0.4 ftp -vV"

  - name: "PortScan - TCP SYN scan on FTP port"
    destination: "ftp"
    category: "PortScan"
    intensity: "low"
    command: "nmap -sS -p 21 ftp-lab"

  - name: "PortScan - full TCP connect scan on common FTP ports"
    destination: "ftp"
    category: "PortScan"
    intensity: "medium"
    command: "nmap -sT -p 20-21 ftp-lab"

